name: build

# Builds the Windows binary, runs the tests, and publishes a release on a version tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tests run first and the build waits on them, so a tag cannot publish a binary
  # whose tests failed.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A cache is worth having here for the same reason it was not for the Go build:
      # this one compiles a hundred crates, and without it a tag build takes minutes.
      - uses: Swatinem/rust-cache@v2
      - run: python -m unittest discover -s .github/scripts
      - name: Check dependency graph excludes vulnerable GLib
        shell: pwsh
        run: |
          $graph = cargo tree --locked --target all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($graph -match '\bglib v') {
            throw "GLib has returned to the dependency graph; review GHSA-wrw7-89jp-8q8g"
          }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          # The version the program reports comes from Cargo.toml rather than from the
          # tag, so a build from main and a build from a tag differ only in their name.
          # A tag is checked against it below instead of being pasted into it.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "0.0.0-" + $env:GITHUB_SHA.Substring(0,12)
          }
          cargo build --release --locked
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/wbtray.exe dist/wbtray.exe
          Set-Content -Path dist/version.txt -Value $version -NoNewline
          Get-Item dist/wbtray.exe | Select-Object Name, Length

      # The icon is the one part of a Windows build that compiles without complaint and
      # can still be wrong: a resource section the linker drops, or an image Windows
      # rejects, produces an executable that runs and quietly shows the system's generic
      # icon. The test reads the built file the way Windows reads it.
      - name: Check the executable carries its icon
        shell: pwsh
        run: |
          $env:WBTRAY_BUILT_EXE = (Resolve-Path dist/wbtray.exe).Path
          cargo test --release --test built_executable -- --nocapture

      # The tray updates itself by downloading this archive, so the archive is the
      # release. A bare .exe beside a manifest would work for a person downloading it by
      # hand and not for the updater, which unpacks into a directory it then swaps in.
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content dist/version.txt -Raw).Trim()
          $name = "wbtray-$version-windows-amd64.zip"
          Compress-Archive -Path dist/wbtray.exe -DestinationPath "dist/$name" -Force
          "archive=dist/$name" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_ENV
          Get-ChildItem dist | Select-Object Name, Length

      # The upstream gateway travels with this release.
      #
      # It is here so that one mirror does for both projects: the upstream project has no
      # cnb.cool repository of its own, and a reader who cannot reach GitHub would
      # otherwise have no way to obtain the gateway at all. The file is fetched rather
      # than rebuilt, so it is byte-for-byte the one upstream published, and its version
      # is written beside it because the mirrored copy keeps a stable name and cannot
      # carry the version in it.
      - name: Mirror the upstream gateway
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # The public API allows anonymous reads, and a token is sent anyway because the
          # shared address this runner uses is one of the busiest on GitHub and the
          # anonymous limit is per address, not per repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $api = "https://api.github.com/repos/linguo2625469/workbuddy2api-panel/releases/latest"
          $headers = @{ "User-Agent" = "wbtray-ci" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }

          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*-windows-amd64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "the upstream release $($release.tag_name) has no windows-amd64 archive"
          }

          Write-Host "mirroring $($release.tag_name): $($asset.name) ($($asset.size) bytes)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "dist/workbuddy2api-panel-windows-amd64.zip" -Headers $headers
          Set-Content -Path "dist/workbuddy2api-panel-version.txt" -Value $release.tag_name -NoNewline

          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: wbtray-windows
          path: |
            dist/wbtray.exe
            dist/wbtray-*-windows-amd64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/wbtray.exe
            dist/wbtray-*-windows-amd64.zip
            dist/workbuddy2api-panel-windows-amd64.zip
            dist/workbuddy2api-panel-version.txt
          generate_release_notes: true
