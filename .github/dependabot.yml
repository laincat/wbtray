# Daily dependency checks; patch/minor merge only after validation.
# Major updates remain separate for compatibility review.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: daily
    time: '20:00'
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    rust-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '20:00'
    timezone: Asia/Shanghai
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci(deps)
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
